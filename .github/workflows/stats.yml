name: Generate Stats Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: "show_icons=true&theme=synthwave&hide_border=true"
          path: profile/stats.svg
      - uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "theme=synthwave&hide_border=true&layout=compact"
          path: profile/top-langs.svg
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update stats cards"
          file_pattern: profile/*.svg
